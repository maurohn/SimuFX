; ============================================================
; SimuFX Preset: Dynamic
; Ligeramente mas brilloso, negros levantados, contraste suave
; AO + Shadow Depth activos para sombras mas ricas y realistas
; ============================================================

[Color]
Enabled=true
Saturation=1.20
Vibrance=0.22
Temperature=0.00
Tint=0.00

[Tonemap]
Enabled=true
Exposure=0.08
Gamma=1.00
Contrast=1.14
Highlights=0.88
Shadows=1.25
Filmic=true

[Bloom]
Enabled=false
Threshold=0.85
Intensity=0.20
Radius=0.60
SoftKnee=0.50

[AntiAliasing]
Enabled=true
Method=FXAA
Strength=1.00
EdgeThreshold=0.063
SubpixelQuality=0.75

[Sharpen]
Enabled=true
Method=CAS
Strength=0.32
Clamp=0.045

[Vignette]
Enabled=false
Intensity=0.10
Radius=0.80
Softness=0.45

[AmbientOcclusion]
; Color-based SSAO: oscurece crevices, bajo el auto, contacto ruedas
Enabled=true
Strength=0.60
Radius=3.5
Bias=0.025

[ShadowDepth]
; Profundiza sombras existentes sin afectar medios/brillos
Enabled=true
Depth=0.50
Threshold=0.42
Feather=0.18
